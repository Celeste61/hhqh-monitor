name: 启航动态监控

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "可选参数：--test 测推送 / --force 强制补推 / 留空为正常巡检"
        required: false
        default: ""

concurrency:
  group: hhqh-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 恢复去重状态
        uses: actions/cache@v6
        with:
          path: state.json
          key: hhqh-state-${{ github.run_id }}
          restore-keys: |
            hhqh-state-

      - name: 巡检并推送
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          PYTHONIOENCODING: utf-8
        run: python hhqh_monitor.py ${{ github.event.inputs.args }}
