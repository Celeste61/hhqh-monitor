<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>启航 · 盟战记录</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-size: 16px; line-height: 1.5;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e6edf7;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: #111c33;
    padding: 12px 14px; border-bottom: 1px solid #23304d;
  }
  h1 { margin: 0 0 10px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 small { font-weight: 400; color: #7d8ba8; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1 1 auto; width: auto; min-width: 0; }
  .row button { flex: 0 0 auto; }
  input, textarea, button, select { font-family: inherit; font-size: 16px; border-radius: 10px; }
  input, textarea {
    width: 100%; padding: 9px 11px; background: #0b1424; color: #e6edf7;
    border: 1px solid #2b3a5c; outline: none;
  }
  select {
    width: 100%; padding: 9px 11px; background: #0b1424; color: #e6edf7;
    border: 1px solid #2b3a5c; outline: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #7d8ba8 50%),
                      linear-gradient(135deg, #7d8ba8 50%, transparent 50%);
    background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  select option { background: #0b1424; color: #e6edf7; }
  input:focus, textarea:focus, select:focus { border-color: #4d7cff; }
  button {
    padding: 9px 13px; background: #1b2942; color: #cfe0ff;
    border: 1px solid #2f4166; cursor: pointer; white-space: nowrap;
  }
  button.primary { background: #2f6bff; border-color: #2f6bff; color: #fff; font-weight: 600; }
  button.ghost { background: transparent; }
  button.danger { color: #ff8f8f; border-color: #5a2b2b; }
  button.tiny { font-size: 13px; padding: 6px 10px; }
  main { padding: 12px 14px 96px; max-width: 820px; margin: 0 auto; }
  .card { background: #131f38; border: 1px solid #24314f; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 7px; border-radius: 999px; background: #24314f; color: #9fb4d8; font-weight: 400; }
  .tag.revive { background: #3a2a12; color: #ffc46b; }
  .tag.left { background: #16324a; color: #7fd0ff; }
  .tag.done { background: #1d3324; color: #7ee0a1; }
  .muted { color: #7d8ba8; font-size: 13px; }
  .big { font-size: 22px; font-weight: 700; color: #8fc0ff; line-height: 1.1; }
  .empty { text-align: center; color: #7d8ba8; padding: 40px 10px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(15,23,42,.96); border-top: 1px solid #23304d;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; max-width: 820px; margin: 0 auto;
  }
  .bar button { flex: 1; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .hint { font-size: 12px; color: #7d8ba8; margin-top: 6px; }
  .team-line {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 0;
    border-top: 1px solid #1e2a45;
  }
  .team-line:first-of-type { border-top: none; }
  .team-line label { display: flex; align-items: center; gap: 6px; color: #cfe0ff; white-space: nowrap; }
  .team-line input[type=checkbox] { width: 20px; height: 20px; accent-color: #2f6bff; padding: 0; }
  .team-line .who-list { color: #9fb4d8; font-size: 14px; }
  .team-line.used { opacity: .5; }
  .team-line.used .who-list { text-decoration: line-through; }
  /* 盟详情里的队伍区块：角色一行，属性用小标签，放不下自动换行 */
  .team-block { border-top: 1px solid #1e2a45; padding: 8px 0 2px; }
  .team-block:first-of-type { border-top: none; padding-top: 4px; }
  .team-head-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .team-head-line label { display: flex; align-items: center; gap: 6px; color: #cfe0ff; white-space: nowrap; }
  .team-head-line input[type=checkbox] { width: 20px; height: 20px; accent-color: #2f6bff; padding: 0; }
  /* 两列网格：左列角色名（宽度自适应队内最长的名字），右列属性标签，换行后左对齐 */
  .chars {
    display: grid; grid-template-columns: auto 1fr;
    column-gap: 8px; row-gap: 4px;
    margin: 6px 0 2px; padding-left: 8px;
    border-left: 2px solid #24314f;
  }
  .cname {
    font-weight: 600; font-size: 14.5px; color: #e6edf7;
    white-space: nowrap; align-self: start; padding-top: 1px;
    max-width: 44vw; overflow: hidden; text-overflow: ellipsis;   /* 名字再长也不会撑破卡片 */
  }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
  .chips .kv.empty { color: #5f6d88; background: transparent; border: 1px dashed #2b3a5c; }
  .kv {
    font-size: 12px; background: #1a2743; color: #b9cdf0;
    border-radius: 6px; padding: 1px 6px; white-space: nowrap;
  }
  .kv i { font-style: normal; color: #7d8ba8; margin-right: 2px; }
  .kv.none { color: #5f6d88; }
  .team-block.used { opacity: .45; }
  .teams { margin-top: 8px; }
  .team { border: 1px dashed #2b3a5c; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .team-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .team-head input { max-width: 120px; }
  .member { border-top: 1px solid #1e2a45; padding-top: 8px; margin-top: 8px; }
  .member:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .grid label { display: block; font-size: 12px; color: #7d8ba8; margin-bottom: 3px; }
  .field { margin-top: 8px; }
  .who { font-size: 13px; background: #1b2942; border-radius: 6px; padding: 3px 7px; color: #b9cdf0; }
  .summary { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .crumb { font-size: 13px; color: #7d8ba8; margin-bottom: 6px; }
  .crumb a { color: #8fc0ff; cursor: pointer; text-decoration: none; }
  .stat { display: flex; gap: 14px; align-items: baseline; margin-top: 6px; }
  .stat div { text-align: center; }
  .stat span { display: block; font-size: 12px; color: #7d8ba8; }
</style>
</head>
<body>

<header><div id="hdr"></div></header>
<main><div id="screen"></div></main>
<div class="bar" id="bar"></div>

<datalist id="roleList"></datalist>
<datalist id="dlHunyu"></datalist>
<datalist id="dlQianneng"></datalist>
<datalist id="dlJue"></datalist>
<datalist id="dlZhubao"></datalist>
<input type="file" id="fileInput" accept="application/json" hidden>

<script src="roles.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "hhqh_battle_log_v2";
  var OLD_KEY = "hhqh_battle_log_v1";
  var FIELDS = [
    { k: "hunyu", label: "魂玉", dl: "dlHunyu", ph: "例如：4攻2防" },
    { k: "qianneng", label: "潜能", dl: "dlQianneng", ph: "例如：满 / 6" },
    { k: "jue", label: "觉", dl: "dlJue", ph: "例如：3觉" },
    { k: "zhubao", label: "珠宝", dl: "dlZhubao", ph: "例如：专属 / 无" }
  ];
  var MEMBERS_PER_TEAM = 5;

  var state = load();
  var view = { name: "alliances", allianceId: "", memberId: "", q: "" };
  var draft = null;   // 编辑中的成员

  /* ---------------- 数据 ---------------- */
  function emptySuggestions() { var s = {}; FIELDS.forEach(function (f) { s[f.k] = []; }); return s; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function blankTeam(label) {
    var members = [];
    for (var i = 0; i < MEMBERS_PER_TEAM; i++) members.push({ name: "", hunyu: "", qianneng: "", jue: "", zhubao: "" });
    return { label: label || "", used: false, members: members };
  }
  function newMember() { return { id: uid(), name: "", note: "", revived: false, updatedAt: Date.now(), teams: [blankTeam("队伍1")] }; }
  function newAlliance(name) { return { id: uid(), name: name || "", note: "", updatedAt: Date.now(), members: [] }; }

  function migrate(raw) {
    if (!raw) return null;
    if (raw.alliances) { if (!raw.suggestions) raw.suggestions = emptySuggestions(); return raw; }
    if (raw.opponents) {   // 从旧版本升级：把扁平对手装进一个「未分组」盟
      var members = raw.opponents.map(function (o) {
        o.teams = (o.teams || []).map(function (t) { if (t.used === undefined) t.used = false; return t; });
        return o;
      });
      return { version: 2, alliances: [{ id: uid(), name: "未分组", note: "从旧版本升级", updatedAt: Date.now(), members: members }],
               suggestions: raw.suggestions || emptySuggestions() };
    }
    return null;
  }
  function load() {
    try { var m = migrate(JSON.parse(localStorage.getItem(KEY))); if (m) return m; } catch (e) {}
    try { var m2 = migrate(JSON.parse(localStorage.getItem(OLD_KEY))); if (m2) return m2; } catch (e) {}
    return { version: 2, alliances: [], suggestions: emptySuggestions() };
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { alert("保存失败，可能是浏览器存储被禁用。建议定期导出备份。"); }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function find(id) { return (state.alliances || []).filter(function (a) { return a.id === id; })[0]; }
  function teamNames(m) {
    return (m.teams || []).map(function (t) {
      return (t.members || []).filter(hasData).map(function (x) { return x.name || "(未填名字)"; }).join("、");
    }).filter(function (s) { return s; });
  }
  /** 只要这一行填了任何一样东西，就算有内容（免得只填了魂玉没填名字的记录被隐藏） */
  function hasData(x) {
    return !!(x && (x.name || x.hunyu || x.qianneng || x.jue || x.zhubao));
  }
  function unusedTeams(m) {
    return (m.teams || []).filter(function (t) { return !t.used && (t.members || []).some(hasData); });
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var hdr = document.getElementById("hdr");
    var scr = document.getElementById("screen");
    var bar = document.getElementById("bar");
    bar.style.display = "";   // 默认显示底部操作条，个别页面会关掉
    if (view.name === "alliances") {
      hdr.innerHTML = '<h1>盟战记录 <small>' + state.alliances.length + " 个盟</small></h1>" +
        '<div class="row"><input id="q" placeholder="搜索盟名或成员名…" value="' + esc(view.q) + '" autocomplete="off">' +
        '<button class="primary" id="addAlliance">＋ 新盟</button></div>';
      scr.innerHTML = renderAlliances();
      bar.innerHTML = '<button class="ghost" id="ioBtn">导入 / 导出</button>';
    } else if (view.name === "alliance") {
      var a = find(view.allianceId);
      if (!a) { view.name = "alliances"; return render(); }
      var total = 0, left = 0;
      a.members.forEach(function (m) { total += (m.teams || []).length; left += unusedTeams(m).length; });
      hdr.innerHTML = '<div class="crumb"><a id="back">← 全部盟</a></div>' +
        '<h1>' + esc(a.name || "(未命名盟)") + " <small>成员 " + a.members.length + " · 还剩 " + left + " / " + total + " 队未打</small></h1>" +
        '<div class="toolbar" style="margin:0">' +
        '<button class="primary tiny" id="addMember">＋ 添加成员</button>' +
        '<button class="tiny" id="overviewBtn">未使用速览</button>' +
        '<button class="tiny" id="resetBtn">全员重置</button>' +
        '<button class="tiny" id="editAlliance">改盟名</button>' +
        '<button class="tiny danger" id="delAlliance">删盟</button>' +
        "</div>";
      scr.innerHTML = renderAlliance(a);
      bar.innerHTML = '<button class="ghost" id="ioBtn">导入 / 导出</button>';
    } else if (view.name === "overview") {
      var a2 = find(view.allianceId);
      if (!a2) { view.name = "alliances"; return render(); }
      hdr.innerHTML = '<div class="crumb"><a id="backAlliance">← ' + esc(a2.name) + "</a></div>" +
        '<h1>未使用队伍速览 <small>按剩余数量排序</small></h1>';
      scr.innerHTML = renderOverview(a2);
      bar.innerHTML = '<button class="ghost" id="ioBtn">导入 / 导出</button>';
    } else if (view.name === "edit") {
      var a3 = find(view.allianceId);
      hdr.innerHTML = '<div class="crumb"><a id="cancel">← 返回' + esc(a3 ? a3.name : "") + "</a></div>" +
        "<h1>" + (draft.isNew ? "新增成员" : "编辑成员") + "</h1>";
      scr.innerHTML = renderEditor();
      bar.innerHTML = '<button class="ghost" id="cancel2">取消</button><button class="primary" id="saveBtn">保存</button>';
    }
  }

  function renderAlliances() {
    var q = (view.q || "").trim();
    if (q) {   // 搜索模式：跨盟搜成员
      var hits = [];
      state.alliances.forEach(function (a) {
        if ((a.name || "").indexOf(q) >= 0) hits.push({ alliance: a, member: null });
        a.members.forEach(function (m) { if ((m.name || "").indexOf(q) >= 0) hits.push({ alliance: a, member: m }); });
      });
      if (!hits.length) return '<div class="empty">没找到「' + esc(q) + "」</div>";
      return hits.map(function (h) {
        if (!h.member) return '<div class="card"><h3>盟：' + esc(h.alliance.name) + "</h3>" +
          '<div class="muted">' + h.alliance.members.length + ' 个成员</div>' +
          '<div class="toolbar" style="margin:8px 0 0"><button data-act="openAlliance" data-id="' + h.alliance.id + '">打开</button></div></div>';
        return '<div class="card"><h3>' + esc(h.member.name) +
          (h.member.revived ? '<span class="tag revive">已复活</span>' : "") +
          '<span class="tag">' + esc(h.alliance.name) + "</span></h3>" +
          '<div class="muted">' + (teamNames(h.member).join(" ／ ") || "暂无队伍") + "</div>" +
          '<div class="toolbar" style="margin:8px 0 0"><button data-act="openMember" data-a="' + h.alliance.id + '" data-id="' + h.member.id + '">查看 / 编辑</button></div></div>';
      }).join("");
    }
    if (!state.alliances.length) {
      return '<div class="empty">还没有盟。点右上角「＋ 新盟」建一个，<br>比如「XX盟」，再把对面助力成员加进去。</div>';
    }
    return state.alliances.map(function (a) {
      var total = 0, left = 0, revived = 0;
      a.members.forEach(function (m) {
        total += (m.teams || []).length;
        left += unusedTeams(m).length;
        if (m.revived) revived++;
      });
      return '<div class="card">' +
        "<h3>" + esc(a.name || "(未命名盟)") + "</h3>" +
        '<div class="stat">' +
        '<div><span class="big">' + left + '</span><span>队未使用</span></div>' +
        '<div><span class="big">' + a.members.length + '</span><span>个成员</span></div>' +
        '<div><span class="big">' + revived + '</span><span>个已复活</span></div>' +
        "</div>" +
        (a.note ? '<div class="muted" style="margin-top:6px">' + esc(a.note) + "</div>" : "") +
        '<div class="toolbar" style="margin:10px 0 0">' +
        '<button class="primary" data-act="openAlliance" data-id="' + a.id + '">打开这个盟</button>' +
        '<button data-act="overview" data-id="' + a.id + '">未使用速览</button>' +
        "</div></div>";
    }).join("");
  }

  /** 成员排序：进入盟时按「剩余队伍多」排一次，之后就冻结顺序——
   *  否则你每勾一个队伍，卡片就会跳位置，很影响操作。 */
  function orderedMembers(a) {
    if (view.orderAlliance !== a.id) {
      view.order = a.members.slice()
        .sort(function (x, y) { return unusedTeams(y).length - unusedTeams(x).length; })
        .map(function (m) { return m.id; });
      view.orderAlliance = a.id;
    }
    var rank = {};
    (view.order || []).forEach(function (id, i) { rank[id] = i; });
    a.members.forEach(function (m, i) {
      if (rank[m.id] === undefined) rank[m.id] = 10000 + i;   // 新加的成员放最后
    });
    return a.members.slice().sort(function (x, y) { return rank[x.id] - rank[y.id]; });
  }

  function renderAlliance(a) {
    if (!a.members.length) return '<div class="empty">这个盟还没有成员。点上方「＋ 添加成员」。</div>';
    var rows = orderedMembers(a);
    return rows.map(function (m) {
      var left = unusedTeams(m).length;
      var teamCount = (m.teams || []).filter(function (t) {
        return (t.members || []).some(hasData);
      }).length;
      var lines = (m.teams || []).map(function (t, ti) {
        var chars = (t.members || []).filter(hasData);
        if (!chars.length) return "";
        var charHtml = chars.map(function (x) {
          var chips = "";
          FIELDS.forEach(function (f) {
            var v = (x[f.k] || "").trim();
            if (v) chips += '<span class="kv"><i>' + f.label + "</i>" + esc(v) + "</span>";
          });
          if (!chips) chips = '<span class="kv empty">未记录配置</span>';
          var showName = x.name || "(未填名字)";
          return '<span class="cname"' + (x.name ? "" : ' style="color:#7d8ba8;font-weight:400"') +
            ">" + esc(showName) + '</span><span class="chips">' + chips + "</span>";
        }).join("");
        return '<div class="team-block' + (t.used ? " used" : "") + '">' +
          '<div class="team-head-line">' +
          '<label><input type="checkbox" data-act="toggleUsed" data-a="' + a.id + '" data-m="' + m.id +
          '" data-t="' + ti + '"' + (t.used ? " checked" : "") + ">" + esc(t.label) + "</label>" +
          '<span class="tag' + (t.used ? " done" : " left") + '">' + (t.used ? "已使用" : "未使用") + "</span>" +
          '<span class="muted">' + chars.length + " 人</span>" +
          "</div>" +
          '<div class="chars">' + charHtml + "</div></div>";
      }).join("");
      return '<div class="card">' +
        "<h3>" + esc(m.name || "(未命名)") +
        (m.revived ? '<span class="tag revive">已复活</span>' : '<span class="tag">未复活</span>') +
        (!teamCount ? '<span class="tag">未记录队伍</span>'
          : left ? '<span class="tag left">还剩 ' + left + ' 队</span>'
                 : '<span class="tag done">全部用完</span>') +
        "</h3>" +
        (m.note ? '<div class="muted">' + esc(m.note) + "</div>" : "") +
        (lines || '<div class="muted">还没有记录队伍</div>') +
        '<div class="toolbar" style="margin:8px 0 0">' +
        '<button class="tiny" data-act="editMember" data-a="' + a.id + '" data-id="' + m.id + '">编辑配置</button>' +
        '<button class="tiny" data-act="resetMember" data-a="' + a.id + '" data-id="' + m.id + '">重置此人</button>' +
        '<button class="tiny danger" data-act="delMember" data-a="' + a.id + '" data-id="' + m.id + '">删除</button>' +
        "</div></div>";
    }).join("");
  }

  function renderOverview(a) {
    var rows = a.members.map(function (m) {
      var teams = unusedTeams(m);
      return { member: m, teams: teams };
    }).filter(function (r) { return r.teams.length; })
      .sort(function (x, y) { return y.teams.length - x.teams.length; });

    if (!rows.length) return '<div class="empty">这个盟的队伍都用完了。<br>点上方「本轮重置」可以开新一轮。</div>';
    var total = rows.reduce(function (n, r) { return n + r.teams.length; }, 0);
    return '<div class="card"><b>共 ' + total + ' 支队还没打</b><div class="muted">按剩余数量排序，勾选框在「全部盟 → 打开这个盟」里操作</div></div>' +
      rows.map(function (r) {
        return '<div class="card"><h3>' + esc(r.member.name || "(未命名)") +
          (r.member.revived ? '<span class="tag revive">已复活</span>' : "") +
          '<span class="tag left">' + r.teams.length + " 队未使用</span></h3>" +
          (r.member.note ? '<div class="muted">' + esc(r.member.note) + "</div>" : "") +
          r.teams.map(function (t) {
            var names = (t.members || []).filter(hasData).map(function (x) { return x.name || "(未填名字)"; }).join("、");
            return '<div class="team-line"><label>' + esc(t.label) + '</label><span class="who-list">' + esc(names) + "</span></div>";
          }).join("") +
          "</div>";
      }).join("");
  }

  function renderEditor() {
    var m = draft;
    var teams = (m.teams || []).map(function (team, ti) {
      // 一定要补足空槽位：否则保存过一次的队伍再编辑时，就没法再加角色了
      var slots = (team.members || []).slice();
      while (slots.length < MEMBERS_PER_TEAM) {
        slots.push({ name: "", hunyu: "", qianneng: "", jue: "", zhubao: "" });
      }
      var members = slots.map(function (x, mi) {
        return '<div class="member">' +
          '<div class="row"><input class="mName" list="roleList" placeholder="第 ' + (mi + 1) +
          ' 个角色（输一个字就有候选）" value="' + esc(x.name) + '" autocomplete="off">' +
          (mi > 0 ? '<button data-act="clearMember" data-t="' + ti + '" data-m="' + mi + '" class="ghost danger">×</button>' : "") + "</div>" +
          '<div class="grid">' + FIELDS.map(function (f) {
            return "<div><label>" + f.label + '</label><input class="m' + f.k + '" list="' + f.dl +
              '" placeholder="' + f.ph + '" value="' + esc(x[f.k]) + '" autocomplete="off"></div>';
          }).join("") + "</div></div>";
      }).join("");
      return '<div class="team" data-t="' + ti + '">' +
        '<div class="team-head">' +
        '<input class="tLabel" placeholder="队伍名" value="' + esc(team.label || ("队伍" + (ti + 1))) + '" autocomplete="off">' +
        '<label class="muted" style="display:flex;align-items:center;gap:6px"><input type="checkbox" class="tUsed" style="width:20px;height:20px;accent-color:#2f6bff"' +
        (team.used ? " checked" : "") + ">本轮已使用</label>" +
        '<button data-act="copyTeam" data-t="' + ti + '" class="ghost tiny">复制</button>' +
        (ti > 0 ? '<button data-act="delTeam" data-t="' + ti + '" class="ghost danger tiny">删除</button>' : "") +
        "</div>" + members + "</div>";
    }).join("");
    return '<div class="card">' +
      '<div class="field"><label class="muted">成员名字 / ID</label><input id="fName" value="' + esc(m.name) + '" placeholder="例如：海贼王路飞" autocomplete="off"></div>' +
      '<div class="field"><label class="muted">是否已复活</label><select id="fRevive"><option value="no"' + (m.revived ? "" : " selected") + '>未复活</option><option value="yes"' + (m.revived ? " selected" : "") + '>已复活</option></select></div>' +
      '<div class="field"><label class="muted">备注（可选）</label><input id="fNote" value="' + esc(m.note) + '" placeholder="例如：习惯先手开大 / 上周换过阵容" autocomplete="off"></div>' +
      "</div>" + teams +
      '<div class="toolbar"><button id="addTeamBtn">＋ 再加一支队伍</button></div>' +
      '<p class="hint">角色名输一个字就会弹出候选；魂玉 / 潜能 / 觉 / 珠宝 会记住你填过的内容。</p>';
  }

  /* ---------------- 编辑逻辑 ---------------- */
  function collectEditor() {
    var teams = [];
    var boxes = document.querySelectorAll("#screen .team");
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      var names = box.querySelectorAll(".mName");
      var members = [];
      for (var j = 0; j < names.length; j++) {
        var m = { name: names[j].value.trim().replace(/^(UR|SSS|SS\+|SP|SS|S|A|B)\s+/, "") };
        var has = !!m.name;
        FIELDS.forEach(function (f) {
          var input = box.querySelectorAll(".m" + f.k)[j];
          m[f.k] = input ? input.value.trim() : "";
          if (m[f.k]) has = true;
        });
        if (has) members.push(m);
      }
      if (!members.length) continue;
      var labelInput = box.querySelector(".tLabel");
      var usedInput = box.querySelector(".tUsed");
      teams.push({
        label: labelInput ? labelInput.value.trim() : "",
        used: usedInput ? usedInput.checked : false,
        members: members
      });
    }
    return teams;
  }
  function remember(teams) {
    teams.forEach(function (t) {
      t.members.forEach(function (m) {
        FIELDS.forEach(function (f) {
          var v = (m[f.k] || "").trim();
          if (!v) return;
          var list = state.suggestions[f.k];
          if (list.indexOf(v) < 0) list.unshift(v);
          if (list.length > 40) list.length = 40;
        });
      });
    });
    renderDatalists();
  }
  function renderDatalists() {
    document.getElementById("roleList").innerHTML = (window.ROLES || []).map(function (r) {
      return '<option value="' + esc(r.r ? r.r + " " + r.n : r.n) + '"></option>';
    }).join("");
    FIELDS.forEach(function (f) {
      document.getElementById(f.dl).innerHTML = (state.suggestions[f.k] || []).map(function (v) {
        return '<option value="' + esc(v) + '"></option>';
      }).join("");
    });
  }
  function saveEditor() {
    var name = document.getElementById("fName").value.trim();
    if (!name) { alert("先填成员名字"); return; }
    var teams = collectEditor();
    if (!teams.length) { alert("至少记录一个角色"); return; }
    var a = find(view.allianceId);
    var wasRevived = !!draft.revived;
    var nowRevived = document.getElementById("fRevive").value === "yes";
    var isNew = !!draft.isNew;
    draft.name = name;
    draft.note = document.getElementById("fNote").value.trim();
    draft.revived = nowRevived;
    draft.teams = teams;
    draft.updatedAt = Date.now();
    a.updatedAt = Date.now();
    if (isNew) { delete draft.isNew; a.members.push(draft); }
    // 复活是个人的事：刚标记为复活时，问一下要不要把这个人的队伍恢复成未使用
    if (!isNew && !wasRevived && nowRevived) {
      if (confirm("「" + name + "」标记为已复活。\n要不要把他名下的队伍都恢复成「未使用」？")) {
        draft.teams.forEach(function (t) { t.used = false; });
      }
    }
    remember(teams);
    persist();
    view.name = "alliance";
    render();
  }

  /** 结构变化前先把表单里填了一半的内容收回 draft，避免重绘时丢失 */
  function syncDraft() {
    if (view.name !== "edit" || !draft) return;
    var n = document.getElementById("fName"); if (n) draft.name = n.value;
    var no = document.getElementById("fNote"); if (no) draft.note = no.value;
    var rv = document.getElementById("fRevive"); if (rv) draft.revived = rv.value === "yes";
    var teams = collectEditor();
    if (teams.length) draft.teams = teams;
  }

  /* ---------------- 导入导出 ---------------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  }
  function exportCsv() {
    var rows = [["盟", "成员", "是否复活", "队伍", "本轮已使用", "角色", "魂玉", "潜能", "觉", "珠宝", "成员备注"]];
    state.alliances.forEach(function (a) {
      a.members.forEach(function (m) {
        (m.teams || []).forEach(function (t) {
          (t.members || []).forEach(function (x) {
            rows.push([a.name, m.name, m.revived ? "是" : "否", t.label || "", t.used ? "是" : "否",
              x.name, x.hunyu || "", x.qianneng || "", x.jue || "", x.zhubao || "", m.note || ""]);
          });
        });
      });
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
    download("启航盟战记录_" + new Date().toISOString().slice(0, 10) + ".csv", "\ufeff" + csv, "text/csv;charset=utf-8");
  }
  function ioMenu() {
    var c = prompt("输入数字选择：\n1 = 导出 JSON 备份\n2 = 导出 CSV（Excel 可打开）\n3 = 从 JSON 恢复\n4 = 清空全部数据", "1");
    if (c === "1") download("启航盟战记录_" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(state, null, 2), "application/json");
    else if (c === "2") exportCsv();
    else if (c === "3") document.getElementById("fileInput").click();
    else if (c === "4") {
      if (confirm("确定清空全部数据？建议先导出备份。") && confirm("真的清空？不可撤销。")) {
        state = { version: 2, alliances: [], suggestions: emptySuggestions() };
        persist(); renderDatalists(); view = { name: "alliances", allianceId: "", memberId: "", q: "" }; render();
      }
    }
  }
  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = migrate(JSON.parse(reader.result));
        if (!data) throw new Error("格式不对");
        if (!confirm("导入会覆盖当前数据，继续？")) return;
        state = data; persist(); renderDatalists();
        view = { name: "alliances", allianceId: "", memberId: "", q: "" }; render();
        alert("导入成功：" + state.alliances.length + " 个盟。");
      } catch (e) { alert("导入失败：" + e.message); }
    };
    reader.readAsText(file);
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    // 注意要带上 a[id]：左上角的返回是链接，不是按钮
    var btn = (t && t.closest) ? t.closest("button[data-act], button[id], a[id]") : null;
    var id = btn ? btn.id : null;
    var act = btn ? btn.getAttribute("data-act") : null;

    if (id === "addAlliance") {
      var name = prompt("盟的名字（例如：XX盟 / 对面一盟）", "");
      if (name === null) return;
      var a = newAlliance(name.trim() || "未命名盟");
      state.alliances.push(a);
      persist(); view.name = "alliance"; view.allianceId = a.id; render(); return;
    }
    // 返回动作按层级来：盟详情 → 盟列表；速览 / 编辑 → 盟详情（和面包屑写的一致）
    if (id === "back") { view = { name: "alliances", allianceId: "", memberId: "", q: "" }; render(); return; }
    if (id === "backAlliance" || id === "cancel" || id === "cancel2") {
      view.name = "alliance";
      render(); return;
    }
    if (id === "ioBtn") { ioMenu(); return; }
    if (id === "overviewBtn") { view.name = "overview"; render(); return; }
    if (id === "addMember") { draft = newMember(); draft.isNew = true; view.name = "edit"; render(); return; }
    if (id === "addTeamBtn") {
      syncDraft();
      var teams = collectEditor(); teams.push(blankTeam("队伍" + (teams.length + 1)));
      draft.teams = teams; render();
      return;
    }
    if (id === "saveBtn") { saveEditor(); return; }
    if (id === "editAlliance") {
      var a2 = find(view.allianceId);
      var n = prompt("盟的名字", a2.name);
      if (n === null) return;
      a2.name = n.trim(); persist(); render(); return;
    }
    if (id === "delAlliance") {
      var a3 = find(view.allianceId);
      if (confirm("删除「" + a3.name + "」以及里面的全部成员记录？")) {
        state.alliances = state.alliances.filter(function (x) { return x.id !== a3.id; });
        persist(); view = { name: "alliances", allianceId: "", memberId: "", q: "" }; render();
      }
      return;
    }
    if (id === "resetBtn") {
      var a4 = find(view.allianceId);
      var names = a4.members.map(function (m) { return m.name || "(未命名)"; }).join("、");
      if (!confirm("盟战结束，把「" + a4.name + "」恢复到初始状态？\n\n" +
                   "会清空全部 " + a4.members.length + " 个成员的队伍勾选，并把复活状态全部改回「未复活」：\n" +
                   names + "\n\n（只想重置某一个人，请用他卡片上的「重置此人」）")) return;
      a4.members.forEach(function (m) {
        (m.teams || []).forEach(function (x) { x.used = false; });
        m.revived = false;
      });
      a4.updatedAt = Date.now();
      persist(); render(); return;
    }
    if (id === "q") return;

    if (act === "openAlliance") {
      view.name = "alliance";
      view.allianceId = btn.getAttribute("data-id");
      view.orderAlliance = null;    // 重新进盟时刷新一次排序
      render(); return;
    }
    if (act === "overview") { view.name = "overview"; view.allianceId = btn.getAttribute("data-id"); render(); return; }
    if (act === "openMember" || act === "editMember") {
      var aid = btn.getAttribute("data-a") || view.allianceId;
      var mid = btn.getAttribute("data-id");
      var al = find(aid);
      draft = al.members.filter(function (m) { return m.id === mid; })[0];
      view.name = "edit"; view.allianceId = aid; render(); return;
    }
    if (act === "delMember") {
      var al2 = find(btn.getAttribute("data-a") || view.allianceId);
      var mid2 = btn.getAttribute("data-id");
      var target = al2.members.filter(function (m) { return m.id === mid2; })[0];
      if (confirm("删除「" + (target.name || "这个成员") + "」？")) {
        al2.members = al2.members.filter(function (m) { return m.id !== mid2; });
        persist(); render();
      }
      return;
    }
    if (act === "resetMember") {
      var al3 = find(btn.getAttribute("data-a") || view.allianceId);
      var mid3 = btn.getAttribute("data-id");
      var mm = al3.members.filter(function (m) { return m.id === mid3; })[0];
      var cnt = (mm.teams || []).length;
      if (!confirm("「" + (mm.name || "该成员") + "」复活了：\n把 " + cnt + " 支队伍恢复成「未使用」，并标记为「已复活」？")) return;
      (mm.teams || []).forEach(function (t) { t.used = false; });
      mm.revived = true;
      mm.updatedAt = Date.now();
      persist(); render(); return;
    }
    if (act === "copyTeam") {
      syncDraft();
      var ts = collectEditor();
      var ti = parseInt(btn.getAttribute("data-t"), 10);
      var clone = JSON.parse(JSON.stringify(ts[ti]));
      clone.label = "队伍" + (ts.length + 1); clone.used = false;
      ts.push(clone); draft.teams = ts; render(); return;
    }
    if (act === "delTeam") {
      syncDraft();
      var ts2 = collectEditor();
      ts2.splice(parseInt(btn.getAttribute("data-t"), 10), 1);
      draft.teams = ts2; render(); return;
    }
    if (act === "clearMember") {
      syncDraft();
      var ts3 = collectEditor();
      ts3[parseInt(btn.getAttribute("data-t"), 10)].members[parseInt(btn.getAttribute("data-m"), 10)] =
        { name: "", hunyu: "", qianneng: "", jue: "", zhubao: "" };
      draft.teams = ts3; render(); return;
    }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t && t.getAttribute && t.getAttribute("data-act") === "toggleUsed") {
      var a = find(t.getAttribute("data-a"));
      var mid = t.getAttribute("data-m");
      var ti = parseInt(t.getAttribute("data-t"), 10);
      a.members.forEach(function (m) {
        if (m.id !== mid) return;
        if ((m.teams || [])[ti]) m.teams[ti].used = t.checked;
      });
      persist();
      var y = window.scrollY; render(); window.scrollTo(0, y);
    }
    if (t && t.id === "fileInput" && t.files && t.files[0]) { importJson(t.files[0]); t.value = ""; }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target && ev.target.id === "q") {
      view.q = ev.target.value;
      var y = window.scrollY;
      document.getElementById("screen").innerHTML = renderAlliances();
      window.scrollTo(0, y);
    }
  });

  if (!window.ROLES || !window.ROLES.length) {
    document.getElementById("screen").innerHTML =
      '<div class="empty">没有加载到角色名单（roles.js）。<br>请确认它和 index.html 在同一个文件夹。</div>';
  }
  renderDatalists();
  render();
})();
</script>
</body>
</html>
